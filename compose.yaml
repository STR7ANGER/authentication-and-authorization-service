services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: identity, POSTGRES_USER: identity, POSTGRES_PASSWORD: identity }
    ports: ["5491:5432"]
    volumes: ["identity-postgres:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U identity -d identity"], interval: 3s, timeout: 3s, retries: 20 }
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6431:6379"]
    volumes: ["identity-redis:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 20 }
  identity-core:
    build: ./services/identity
    ports: ["8091:8091"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8091/health"], interval: 5s, timeout: 3s, retries: 20 }
volumes:
  identity-postgres: {}
  identity-redis: {}
